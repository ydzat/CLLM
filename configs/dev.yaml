model:
  d: 64              # hidden dim
  layers: 1          # L
  d_ff: 256          # FFN hidden dim
  heads: 8
  block_size: 4      # T (blocks are T x T chars)
  width: 64          # W (chars per line)
  seq_len: 1024      # N (must equal H*W with H,W divisible by T)
  vocab_size: 8000
  alpha: 0.5         # FFN routing fraction
data:
  batch_size: 2
  # mask ratio sampled per batch ~ U(0,1) (variable-mask diffusion)
training:
  steps: 3
  lr: 0.001
