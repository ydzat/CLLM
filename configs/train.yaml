model:
  d: 512             # hidden dim (60M model per docs/architecture.md)
  layers: 12         # L
  d_ff: 2048
  heads: 8
  block_size: 4      # T (blocks are T x T chars)
  width: 64          # W (chars per line)
  seq_len: 1024
  vocab_size: 8000
  alpha: 0.5         # FFN routing fraction
data:
  batch_size: 32
  mask_ratio: 0.15
training:
  steps: 30000       # ~1B tokens at batch 32 x seq 1024
  lr: 0.0003
  min_lr: 0.00003    # cosine floor = 0.1 x lr
  warmup_steps: 2000
